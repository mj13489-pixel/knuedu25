                { name: "환경공학개론", type: "전공선택", year: 4, semester: 1, isBasic: false, isTeaching: false, credits: 3, professor: "조재희" },
                { name: "환경공간통계 및 실습", type: "전공선택", year: 4, semester: 1, isBasic: false, isTeaching: false, credits: 3, professor: "황진후" },
                { name: "토양오염론", type: "전공선택", year: 4, semester: 1, isBasic: true, isTeaching: false, credits: 3, professor: "황진후" },
                { name: "환경분석", type: "전공선택", year: 4, semester: 2, isBasic: false, isTeaching: false, credits: 3, professor: "이정현" },
                { name: "환경캡스톤디자인", type: "전공선택", year: 4, semester: 2, isBasic: false, isTeaching: false, credits: 3, professor: "이재영" },
                { name: "환경재해와 방재", type: "전공선택", year: 4, semester: 2, isBasic: false, isTeaching: false, credits: 3, professor: "황진후" },
                { name: "환경법과 정책", type: "전공선택", year: 4, semester: 2, isBasic: true, isTeaching: false, credits: 3, professor: "황진후" },
                { name: "사회환경교육현장실습", type: "전공선택", year: 4, semester: 2, isBasic: false, isTeaching: false, credits: 3, professor: "이재영" },
                { name: "해양환경론", type: "전공선택", year: 4, semester: 2, isBasic: true, isTeaching: false, credits: 3, professor: "이정현" },
                { name: "신재생에너지와 미래환경", type: "전공선택", year: 4, semester: 2, isBasic: false, isTeaching: false, credits: 3, professor: "황진후" }
            ]
        };

        const targetRequirements = {
            "25": {
                "단일전공": { req: 27, elec: 45, basic: 21, teaching: 8 },
                "복수전공": { req: 27, elec: 24, basic: 21, teaching: 8 }
            },
            "26": {
                "단일전공": { req: 24, elec: 48, basic: 21, teaching: 8 },
                "복수전공": { req: 24, elec: 27, basic: 21, teaching: 8 }
            }
        };

        // --- State ---
        let currentUserCode = null;
        let admissionYear = '25';
        let majorType = '단일전공';
        let completedCourses = [];

        // DOM Elements
        const loginScreen = document.getElementById('login-screen');
        const loginForm = document.getElementById('login-form');
        const userCodeInput = document.getElementById('user-code-input');
        const appContainer = document.getElementById('app-container');
        const currentUserBadge = document.getElementById('current-user-badge');
        
        const selectYear = document.getElementById('select-year');
        const selectMajor = document.getElementById('select-major');
        const btnReset = document.getElementById('btn-reset');
        const btnLogout = document.getElementById('btn-logout');
        
        const filterSearch = document.getElementById('filter-search');
        const filterYear = document.getElementById('filter-year');
        const filterSemester = document.getElementById('filter-semester');
        const filterType = document.getElementById('filter-type');
        const filterStatus = document.getElementById('filter-status');
        
        const dashboardGrid = document.getElementById('dashboard-grid');
        const courseGrid = document.getElementById('course-grid');
        const courseCount = document.getElementById('course-count');
        const emptyState = document.getElementById('empty-state');

        const resetModal = document.getElementById('reset-modal');
        const modalUserCode = document.getElementById('modal-user-code');
        const btnCancelReset = document.getElementById('btn-cancel-reset');
        const btnConfirmReset = document.getElementById('btn-confirm-reset');

        // --- Core Logic ---

        function getStorageKey(key) {
            return `edu_tracker_${currentUserCode}_${key}`;
        }

        function saveData() {
            if (!currentUserCode) return;
            localStorage.setItem(getStorageKey('year'), admissionYear);
            localStorage.setItem(getStorageKey('major'), majorType);
            localStorage.setItem(getStorageKey('completed'), JSON.stringify(completedCourses));
        }

        function loadData(code) {
            currentUserCode = code;
            admissionYear = localStorage.getItem(getStorageKey('year')) || '25';
            majorType = localStorage.getItem(getStorageKey('major')) || '단일전공';
            
            try {
                const storedCompleted = localStorage.getItem(getStorageKey('completed'));
                completedCourses = storedCompleted ? JSON.parse(storedCompleted) : [];
            } catch(e) {
                completedCourses = [];
            }

            // Update UI inputs
            selectYear.value = admissionYear;
            selectMajor.value = majorType;
            currentUserBadge.textContent = code;
            currentUserBadge.classList.remove('hidden');
            
            renderApp();
        }

        function handleLogin(e) {
            e.preventDefault();
            const code = userCodeInput.value.trim();
            if (code) {
                loginScreen.classList.add('hidden');
                appContainer.classList.remove('hidden');
                appContainer.classList.add('flex');
                loadData(code);
            }
        }

        function handleLogout() {
            saveData();
            currentUserCode = null;
            userCodeInput.value = '';
            appContainer.classList.add('hidden');
            appContainer.classList.remove('flex');
            loginScreen.classList.remove('hidden');
        }

        function toggleCourse(courseName) {
            const index = completedCourses.indexOf(courseName);
            if (index > -1) {
                completedCourses.splice(index, 1);
            } else {
                completedCourses.push(courseName);
            }
            saveData();
            renderApp();
        }

        // --- Rendering ---

        function createProgressBar(label, current, target, colorClass) {
            const percent = Math.min(100, Math.max(0, (current / target) * 100)) || 0;
            return `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                    <div class="flex justify-between items-center mb-3 gap-2">
                        <span class="text-sm font-semibold text-slate-600 whitespace-nowrap">${label}</span>
                        <span class="text-sm font-bold text-slate-800 bg-slate-50 px-2 py-1 rounded-md whitespace-nowrap">
                            ${current} <span class="text-slate-400 font-normal">/ ${target}학점</span>
                        </span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                        <div class="h-full rounded-full transition-all duration-500 ease-out ${colorClass}" style="width: ${percent}%"></div>
                    </div>
                </div>
            `;
        }

        function renderDashboard(currentCurriculum) {
            let req = 0, elec = 0, basic = 0, teaching = 0;
            
            currentCurriculum.forEach(course => {
                if (completedCourses.includes(course.name)) {
                    if (course.type === '전공기초') req += course.credits;
                    if (course.type === '전공선택') elec += course.credits;
                    if (course.isBasic) basic += course.credits;
                    if (course.isTeaching) teaching += course.credits;
                }
            });

            const targets = targetRequirements[admissionYear][majorType];
            const totalTarget = targets.req + targets.elec;
            const totalCurrent = req + elec;

            dashboardGrid.innerHTML = `
                ${createProgressBar('전공 총 이수', totalCurrent, totalTarget, 'bg-blue-500')}
                ${createProgressBar('전공기초', req, targets.req, 'bg-indigo-500')}
                ${createProgressBar('전공선택', elec, targets.elec, 'bg-orange-500')}
                ${createProgressBar('기본이수과목', basic, targets.basic, 'bg-emerald-500')}
                ${createProgressBar('교과교육학', teaching, targets.teaching, 'bg-purple-500')}
            `;
        }

        function renderCourses(currentCurriculum) {
            const sq = filterSearch.value.toLowerCase();
            const fy = filterYear.value;
            const fs = filterSemester.value;
            const ft = filterType.value;
            const fStatus = filterStatus.value;

            const filtered = currentCurriculum.filter(course => {
                const matchSearch = course.name.toLowerCase().includes(sq);
                const matchYear = fy === 'All' || course.year.toString() === fy;
                const matchSemester = fs === 'All' || course.semester.toString() === fs;
                const matchType = ft === 'All' || course.type === ft;
                
                let matchStatus = true;
                if (fStatus === '이수') matchStatus = completedCourses.includes(course.name);
                if (fStatus === '미이수') matchStatus = !completedCourses.includes(course.name);

                return matchSearch && matchYear && matchSemester && matchType && matchStatus;
            });

            courseCount.textContent = filtered.length;

            if (filtered.length === 0) {
                courseGrid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            const html = filtered.map(course => {
                const isCompleted = completedCourses.includes(course.name);
                const isReq = course.type === '전공기초';
                
                return `
                    <div class="course-card relative p-5 rounded-2xl border-2 cursor-pointer transition-all duration-200 
                        ${isCompleted ? 'bg-emerald-50/50 border-emerald-400' : 'bg-white border-slate-100 hover:border-slate-300 shadow-sm'}"
                        onclick="toggleCourse('${course.name}')">
                        
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs font-bold px-2.5 py-1 rounded-md whitespace-nowrap 
                                ${isReq ? 'bg-indigo-100 text-indigo-700' : 'bg-orange-100 text-orange-700'}">
                                ${course.type}
                            </span>
                            
                            <div class="w-6 h-6 rounded-full flex items-center justify-center border-2 transition-colors shrink-0 
                                ${isCompleted ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 text-transparent'}">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                        </div>
                        
                        <h3 class="text-[1.1rem] font-bold mb-2 leading-tight text-slate-800 break-keep">
                            ${course.name}
                        </h3>
                        
                        <div class="flex flex-wrap items-center gap-x-2 gap-y-1 text-sm text-slate-500 mb-4 font-medium">
                            <span class="whitespace-nowrap">${course.year}학년 ${course.semester}학기</span>
                            <span class="w-1 h-1 rounded-full bg-slate-300 shrink-0 hidden sm:block"></span>
                            <span class="whitespace-nowrap">${course.credits}학점</span>
                            <span class="w-1 h-1 rounded-full bg-slate-300 shrink-0 hidden sm:block"></span>
                            <span class="whitespace-nowrap">${course.professor} 교수님</span>
                        </div>
                        
                        <div class="flex flex-wrap gap-1.5 mt-auto">
                            ${course.isBasic ? '<span class="text-[11px] font-semibold px-2 py-1 bg-emerald-100 text-emerald-700 rounded border border-emerald-200 whitespace-nowrap">기본이수과목</span>' : ''}
                            ${course.isTeaching ? '<span class="text-[11px] font-semibold px-2 py-1 bg-purple-100 text-purple-700 rounded border border-purple-200 whitespace-nowrap">교과교육학</span>' : ''}
                        </div>
                    </div>
                `;
            }).join('');

            courseGrid.innerHTML = html;
        }

        function renderApp() {
            const currentCurriculum = courseData[admissionYear] || [];
            renderDashboard(currentCurriculum);
            renderCourses(currentCurriculum);
        }

        // --- Event Listeners ---

        loginForm.addEventListener('submit', handleLogin);
        btnLogout.addEventListener('click', handleLogout);

        selectYear.addEventListener('change', (e) => {
            admissionYear = e.target.value;
            saveData();
            renderApp();
        });

        selectMajor.addEventListener('change', (e) => {
            majorType = e.target.value;
            saveData();
            renderApp();
        });

        [filterSearch, filterYear, filterSemester, filterType, filterStatus].forEach(el => {
            el.addEventListener('input', () => {
                const currentCurriculum = courseData[admissionYear] || [];
                renderCourses(currentCurriculum);
            });
        });

        // Reset Modal Logic
        btnReset.addEventListener('click', () => {
            modalUserCode.textContent = currentUserCode;
            resetModal.classList.remove('hidden');
            resetModal.classList.add('flex');
        });

        btnCancelReset.addEventListener('click', () => {
            resetModal.classList.add('hidden');
            resetModal.classList.remove('flex');
        });

        btnConfirmReset.addEventListener('click', () => {
            completedCourses = [];
            saveData();
            renderApp();
            resetModal.classList.add('hidden');
            resetModal.classList.remove('flex');
        });

    </script>
</body>
</html>
